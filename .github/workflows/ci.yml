name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build-test:
    runs-on: ubuntu-latest

    # The Postgres-backed tests in this repo (internal/audit,
    # internal/credentials, internal/monitoring, internal/dbschema) all
    # skip unless their own DSN env var is set, so before this service existed a green CI
    # run proved gofmt, build, vet, and the in-memory implementations
    # only. Every Postgres implementation, including the audit hash
    # chain's SELECT ... FOR UPDATE serialization, went unexercised.
    # One container covers all three, they use separate tables in the
    # same database.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: nia
          POSTGRES_PASSWORD: nia
          POSTGRES_DB: nia_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nia -d nia_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      NIA_AUDIT_TEST_DATABASE_URL: "postgres://nia:nia@localhost:5432/nia_test?sslmode=disable"
      NIA_CREDENTIALS_TEST_DATABASE_URL: "postgres://nia:nia@localhost:5432/nia_test?sslmode=disable"
      NIA_MONITORING_TEST_DATABASE_URL: "postgres://nia:nia@localhost:5432/nia_test?sslmode=disable"
      NIA_RISK_TEST_DATABASE_URL: "postgres://nia:nia@localhost:5432/nia_test?sslmode=disable"
      NIA_REGISTRY_TEST_DATABASE_URL: "postgres://nia:nia@localhost:5432/nia_test?sslmode=disable"
      NIA_INCIDENT_TEST_DATABASE_URL: "postgres://nia:nia@localhost:5432/nia_test?sslmode=disable"
      NIA_POLICY_LOCK_TEST_DATABASE_URL: "postgres://nia:nia@localhost:5432/nia_test?sslmode=disable"
      NIA_DBSCHEMA_TEST_DATABASE_URL: "postgres://nia:nia@localhost:5432/nia_test?sslmode=disable"
      # Not a real deployment key, only the value the live checkpoint
      # tests sign with. A real one is generated per deployment and kept
      # out of the audit database, see internal/audit/checkpoint.go.
      NIA_AUDIT_CHECKPOINT_KEY: "MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY="

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
      - name: Format check
        run: |
          fmt_out="$(gofmt -l .)"
          if [ -n "$fmt_out" ]; then
            echo "gofmt found unformatted files:"
            echo "$fmt_out"
            exit 1
          fi
      - name: Build
        run: go build ./...
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./... -race
      # The live tests skip silently when their env var is missing, which
      # is exactly the failure mode this job exists to prevent: a
      # misconfigured DSN would make CI green again without running any
      # of them. Assert they actually ran instead of trusting the
      # overall pass.
      - name: Confirm the Postgres-backed tests actually ran
        run: |
          go test ./internal/audit/ ./internal/credentials/ ./internal/monitoring/ ./internal/risk/ ./internal/registry/ ./internal/incident/ ./internal/policy/ ./internal/dbschema/ -run 'Live' -v 2>&1 | tee live.log
          for name in TestPostgresSink_Live TestPostgresStore_Live TestPostgresRiskStore_Live TestPostgresCallHistory_Live TestPostgresAgentRegistry_Live TestPostgresLocker_Live TestPostgresCheckpointStore_Live TestPostgresStore_Live_CertificateBinding TestApply_ConcurrentBootstrap_Live TestApply_RepeatBootstrap_Live TestApply_ReleasesTheLock_Live; do
            if grep -q -- "--- SKIP: $name" live.log; then
              echo "$name was skipped, its DSN env var is not reaching the test"
              exit 1
            fi
            if ! grep -q -- "--- PASS: $name" live.log; then
              echo "$name did not run"
              exit 1
            fi
          done

    # Not covered here: internal/policy's two live cross-service tests.
    # tessera_client_live_test.go spawns a real Tessera.Service and needs
    # the dotnet SDK plus that repo checked out (NIA_TESSERA_REPO_PATH).
    # openfga_live_test.go needs a running Tessera and the OpenFGA
    # instance it is configured against, four variables, see that file's
    # own comment. Both stay local opt ins. They are the two that catch
    # wire-format mismatches against another service, so they are worth
    # running by hand before anything that touches the policy client
    # ships.

  # The Go toolchain on the runner never reads deployments/, so nothing
  # in build-test can see a broken Dockerfile. That is not hypothetical:
  # both Dockerfiles pinned golang:1.24-alpine for a while after go.mod
  # moved to 1.25, so every docker build failed with "go.mod requires go
  # >= 1.25.0" while CI stayed green, and it was only found by someone
  # trying to follow the README. This job exists to catch that class of
  # drift, where the images and the module disagree.
  #
  # It builds NIA's own two images and nothing else. The compose stack
  # also builds Tessera from ../../tessera, a separate repository that
  # is not checked out here, so bringing the whole stack up is out of
  # scope for CI and stays a local step, see README.md.
  docker-build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build the api image
        run: docker build -f deployments/Dockerfile.api -t nia-api:ci .

      - name: Build the gateway image
        run: docker build -f deployments/Dockerfile.gateway -t nia-gateway:ci .

      # Building proves the compile step ran. It does not prove the
      # binary that came out is usable: a multi-stage copy from the
      # wrong path, or a base image the static binary cannot run on,
      # both produce an image that builds and then does nothing. So
      # start it and ask it something.
      - name: Confirm the api image actually serves
        run: |
          docker run -d --rm --name nia-ci-smoke \
            -e NIA_ALLOW_UNAUTHENTICATED=1 -p 8080:8080 nia-api:ci
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8080/healthz >/dev/null 2>&1; then
              echo "healthz answered after ${i}s"
              docker stop nia-ci-smoke >/dev/null
              exit 0
            fi
            sleep 1
          done
          echo "the api image never answered /healthz, its log:"
          docker logs nia-ci-smoke || true
          docker stop nia-ci-smoke >/dev/null || true
          exit 1

      # The gateway has no dependency-free startup path worth serving
      # here, so this checks the weaker but still useful property: the
      # binary in the image runs and reaches its own configuration
      # checks rather than failing to execute at all.
      - name: Confirm the gateway image runs
        run: |
          out="$(docker run --rm nia-gateway:ci 2>&1 || true)"
          echo "$out"
          case "$out" in
            *NIA_OPERATOR_TOKENS_PATH*) echo "the gateway binary ran and refused to start open, as designed" ;;
            *) echo "the gateway image did not reach its own startup checks"; exit 1 ;;
          esac

      # Cheap, and catches a compose file that no longer parses or that
      # references a variable nothing supplies. The values are dummies:
      # this validates the file, it does not start anything.
      - name: Validate the compose file
        env:
          NIA_TESSERA_JWT_SIGNING_KEY: ci-dummy
          TESSERA_OPENFGA_STORE_ID: ci-dummy
          NIA_TOOLS_API_TOKEN: ci-dummy
        run: docker compose -f deployments/docker-compose.yml --env-file /dev/null config >/dev/null
