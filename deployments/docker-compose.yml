# Local dev stack for NIA: the two NIA services, Tessera's HTTP surface,
# OpenFGA, and Postgres. Wired to actually talk to each other, not just
# started side by side: nia-api and nia-gateway point at tessera,
# tessera points at openfga, all over the compose network.
#
# This exact four-service graph has been run, on a real Docker daemon,
# not just written and hoped about. All five containers (this graph plus
# postgres) came up healthy, and a client was onboarded through Tessera,
# checked as allowed directly against OpenFGA, killed, and checked again
# as denied, tuples actually written to and deleted from a real OpenFGA
# store, not the in-memory one. That run caught two real bugs, both
# fixed: IAuthorizationStore wasn't resolving through the container when
# pointed at a real store (see the AddTypedClient commit in tessera's
# history), and ReadTuplesForClientAsync was filtering OpenFGA's /read
# endpoint by user alone, which OpenFGA rejects outright, it has no
# query shape for that (see the same history, next commit). Neither
# would have been caught by the harness tests or the earlier live test
# against Tessera's in-memory store, only a real OpenFGA instance
# exercises that code path.
#
# NIA_TESSERA_JWT_SIGNING_KEY has no default on purpose, same fail-fast
# choice Tessera.Service itself makes for TESSERA_JWT_SIGNING_KEY (see
# Tessera's own Program.cs): a missing shared secret should stop the
# stack at startup, not authenticate every call with a default anyone
# reading this file could guess. Generate one and put it in a `.env`
# file next to this one (compose reads that automatically, don't commit
# it): `openssl rand -base64 32`. Both NIA_TESSERA_JWT_SIGNING_KEY and
# TESSERA_JWT_SIGNING_KEY below must be the exact same value, it's one
# shared secret between the two services, not two different ones.
#
# OPENFGA_STORE_ID has no default either, and can't: OpenFGA doesn't
# come preconfigured with a store, one has to be created against its API
# after it's up, same for the authorization model. That's a real step
# this compose file still can't automate on its own (a store only gets
# an id once OpenFGA is already running, chicken and egg), but it isn't
# manual guesswork anymore either: bring up just postgres and openfga
# first (`docker compose up -d postgres openfga`), then run
# `./bootstrap-openfga.sh`, which creates the store, loads
# openfga-model.json (the actual shape GrantTupleMapper writes, worked
# out and confirmed against a live instance, not from documentation
# alone), and prints the line to add to .env. Then bring up the rest.
#
# Healthchecks: postgres (pg_isready), tessera, nia-api, and nia-gateway
# all have one, each hitting a `/healthz` this codebase actually defines,
# confirmed responding in this exact stack. openfga does not get one
# here, not because it lacks a health endpoint, but because nobody has
# confirmed its actual path against a running instance yet, and a
# healthcheck pointed at a guessed path that's wrong would block startup
# forever, worse than the plain depends_on (container-started, not
# app-ready) it would replace. Add one once someone checks.
#
# NIA_AUDIT_DATABASE_URL points nia-api and nia-gateway at this same
# postgres, same database (nia), a different table (audit_events,
# created on first connect, see internal/audit/postgres_sink.go) than
# whatever openfga would use if it were ever pointed at postgres
# instead of its own default in-memory datastore, which it currently
# is not, see the depends_on above, that's a separate, still-open gap.
# Both NIA services need the exact same value here for the audit trail
# to actually be one shared stream instead of two, hardcoded rather
# than an env var like the JWT signing key above because it isn't a
# secret, just the fixed local-dev credentials already set on the
# postgres service below. This has been run against this exact stack:
# registered an agent through nia-api, denied a gateway call against
# it, killed it, then read nia-api's own audit endpoint back and saw
# all three events together, in order, proof the two processes
# actually share the table rather than each keeping its own history.
# See README.md's Status section for the full sequence.
#
# NIA_AUDIT_CHECKPOINT_KEY anchors the audit trail. Hash chaining
# catches an attacker who rewrites part of it; it cannot catch one who
# rewrites all of it consistently, because a rewritten chain is a valid
# chain over the wrong events and verifies clean. A checkpoint is a
# signed statement that at some moment the tip was a particular hash, so
# rewriting history also requires forging a signature.
#
# Deliberately not set here, and this is the one variable in this file
# where the default being off is the honest choice rather than a
# convenience: the whole mechanism depends on the key living somewhere
# the audit database does not, and a key committed into the compose file
# next to the database credentials would be theatre. Generate one
# (`openssl rand -base64 32`), put it in the same `.env` as the JWT
# signing key, and add it to nia-api's environment below.
#
# Checkpoints themselves are stored in the audit database, so an
# attacker with write access there can delete them but cannot forge one.
# Export them with `niactl audit checkpoints` and keep them somewhere
# else if that matters for your threat model.
#
# NIA_TOOLS_API_URL points nia-gateway at nia-api's own catalog
# endpoint (GET /tools/{name}) so the gateway rejects a call to a tool
# nobody registered before it ever reaches the policy check, see
# internal/registry/tools's HTTPReader and cmd/gateway's package doc
# comment. This is the config this repo would run with; it has not
# been exercised against this exact compose stack yet the way the
# audit trail sequence above was, that's still open, add it to the
# next full stack run rather than assuming it behaves like the
# unit-tested version against a fake server.
#
# NIA_CREDENTIALS_DATABASE_URL, same postgres and database as
# NIA_AUDIT_DATABASE_URL above, a different table (credentials, see
# internal/credentials/postgres.go). This one matters for a reason the
# audit trail doesn't: cmd/gateway's default identity resolver,
# credentialResolver, actually authenticates callers against this
# store now (see cmd/gateway/authn.go), so without both services
# pointed at the same one, a credential issued through nia-api is
# invisible to nia-gateway's own check and every gateway call gets a
# real 401, not because anything is broken, the same "genuinely
# nothing shared" failure mode NIA_TESSERA_BASE_URL has when it's
# missing. Verified this pass against real nia-api and nia-gateway
# binaries pointed at the same local Postgres and a real Tessera.Service,
# not against this exact compose stack, no Docker daemon was available
# to run it through, that's still open, add it to the next full stack
# run rather than assuming compose behaves identically to two bare
# processes.
#
# NIA_OPERATOR_TOKENS_PATH authenticates the callers of the control
# plane itself. Both services refuse to start without it now (see
# internal/opauth.FromEnvEnforced), which is the point: before that,
# unset meant "accept every request unauthenticated" and this file
# didn't set it, so the reference stack exposed agent registration,
# grant writes, credential issuance, kill, restore, and the whole audit
# trail to anyone who could reach port 8080, and nia-gateway served any
# agent's risk total and incident history on 8081 the same way. The
# escape hatch for running open on purpose is NIA_ALLOW_UNAUTHENTICATED=1,
# deliberately not set here.
#
# The file itself is real bearer tokens, so it is gitignored, same
# posture as .env above. Copy deployments/operator-tokens.example.json
# to deployments/operator-tokens.json and put a generated token in it
# (`openssl rand -base64 32`) before bringing the stack up. Both
# services mount the same file: an operator token is one credential for
# the control plane, not one per process.
#
# Every entry must declare roles, and both services refuse to start if
# one does not. viewer can read, operator can also change what exists,
# admin can also kill and restore, see internal/opauth/roles.go. There
# is no default on purpose: defaulting to admin would silently keep the
# gap roles exist to close, and defaulting to viewer would silently
# break a deployment that thought it had granted more.
#
# NIA_OPENFGA_API_URL / NIA_OPENFGA_STORE_ID make a hot-path
# authorization check read live OpenFGA tuples instead of Tessera's
# declared grant list, see internal/policy.OpenFGAChecker. They matter
# because the two genuinely diverge: Tessera's kill deletes a client's
# tuples but leaves its declared grants in place, and restore clears the
# kill sentinel without rewriting them, so between a restore and the next
# grant write, reading the declared list says "allowed" for something
# OpenFGA has no tuple for. That is a fail-open, and it was confirmed
# against this exact pair of services, not argued from source, see
# internal/policy/openfga_live_test.go.
#
# The store id is the same one Tessera is configured with, which
# bootstrap-openfga.sh already prints for TESSERA_OPENFGA_STORE_ID.
# Pointing NIA at a different store would make every check come back
# "not allowed" against an empty store, indistinguishable from an
# ordinary denial, which is why FromEnv errors when only one of the two
# variables is set rather than quietly falling back.
#
# NIA_RISK_FLAG_AT / NIA_RISK_REVOKE_AT / NIA_RISK_KILL_AT turn on
# risk-based monitoring in nia-gateway, see internal/monitoring and
# internal/risk.HistoryScorer. Deliberately not set here: turning on a
# kill threshold in the shared dev stack by default is the kind of
# surprise ("why did my agent just get killed") this file shouldn't
# spring on someone who didn't opt into it. crossing a revoke or kill
# threshold now genuinely revokes credentials through the shared store
# above, not the audited no-op it used to degrade to when nia-gateway
# had no credentials.Store wired in at all. Add the three variables to
# nia-gateway's environment block below to try it locally.
#
# NIA_POLICY_LOCK_DATABASE_URL serializes grant writes across replicas.
# WriteGrants and DeleteGrants are a read, merge, then full onboard,
# because Tessera has no incremental grant endpoint, and the client's
# per-agent mutex only covers one process: two nia-api replicas adding a
# different grant to the same agent at the same time can leave only one
# of the two written, with no error on either side. Set here because
# this stack shares a postgres anyway, and because the cost when there
# is only one replica is one advisory lock per grant write, which is an
# operator-paced operation rather than hot path.
#
# Its own variable rather than reusing one of the store DSNs, even
# though they point at the same database here: "which database holds the
# audit trail" and "where do replicas coordinate" are different
# questions and a deployment that splits them should be able to.
#
# NIA_REGISTRY_DATABASE_URL and NIA_INCIDENT_DATABASE_URL, same
# postgres and database as the others, their own tables (agents, and
# incidents, see internal/registry/postgres.go and
# internal/incident/postgres.go). These were the last two stores still
# keeping state in a process-local map.
#
# The registry one is an inventory problem rather than an enforcement
# one: no authorization decision reads it, GET /agents/{ref} checks kill
# state live against the policy client. But without it a second nia-api
# replica answers 404 for an agent the first registered, and `niactl
# list` shows a different inventory depending on which replica answers.
#
# The incident one matters more than its size suggests. An incident
# record is the evidence for why NIA killed or revoked an agent, the
# risk value, the signals and the cumulative total that triggered it,
# and in a map it died with the process, leaving only the audit line
# saying containment happened. nia-gateway is the process that writes
# them, nia-api does not need this variable, but both are set below so
# the two do not drift apart if a future endpoint reads incidents from
# the control plane side.
#
# NIA_GATEWAY_MCP_DOWNSTREAM_URL turns on the MCP endpoint. The gateway
# then serves MCP over streamable HTTP at /mcp, terminates it, inspects
# the operation, authorizes it, scores it, audits it, and only then opens
# its own separate MCP connection to the downstream server. It is not a
# tunnel: a gateway that forwards the agent's bytes can authenticate the
# connection and nothing else, it cannot tell tools/call from tools/list
# or see which tool and which arguments, which is every decision NIA
# exists to make.
#
# NIA_GATEWAY_MCP_DOWNSTREAM_TOKEN is the credential NIA presents to the
# downstream, and it is deliberately NIA's own. The agent's credential
# authenticates the agent to NIA and stops there: a downstream that
# received it could act as that agent against anything else trusting the
# same credential. NIA_GATEWAY_MCP_DOWNSTREAM_HEADER moves it out of
# Authorization for a downstream that wants it elsewhere.
#
# Deliberately unset here because this stack has no MCP server in it to
# proxy to. Point it at one and the endpoint appears.
#
# Session model is stateless streamable HTTP, so the gateway is safe
# behind a load balancer with no sticky routing and replicas share
# nothing. The cost is one downstream session per call, and the limit is
# that MCP features needing session state (server-initiated messages on
# the standalone SSE stream, resumability, subscriptions) are not
# available, see cmd/gateway/mcp.go.
#
# Rate limiting is on by default in both services and needs no
# configuration here, which is why no NIA_RATE_LIMIT_* variable appears
# below. 50 requests per second per client address (burst 100) and, in
# nia-gateway, 20 per second per authenticated agent (burst 40), both
# per replica. Override with NIA_RATE_LIMIT_PER_CLIENT_RPS /
# _BURST and NIA_GATEWAY_RATE_LIMIT_PER_AGENT_RPS / _BURST; an explicit
# 0 disables one. See internal/ratelimit.
#
# NIA_RATE_LIMIT_TRUST_FORWARDED_FOR is deliberately not set. Turning it
# on makes the per-client key come from X-Forwarded-For, which is right
# behind a proxy that overwrites the header and wrong everywhere else:
# on a directly reachable process anyone can mint unlimited buckets by
# varying one header. Both services in this stack publish ports
# directly, so leaving it unset is correct here.
#
# NIA_RISK_HISTORY_DATABASE_URL, same postgres and database as the
# others, its own four tables (agent_tool_history,
# agent_transition_history, agent_last_tool, agent_calls, see
# internal/risk/postgres_history.go). This is the other half of
# NIA_RISK_DATABASE_URL below: that one shares the cumulative risk
# total, this one shares the signals the total is built from. Without
# it, each replica has its own idea of which tools an agent has ever
# called, so the same tool scores novel_tool once per replica and every
# restart makes the whole catalog novel again, a correctly shared total
# fed by inputs that are neither shared nor stable.
#
# NIA_RISK_RATE_WINDOW / NIA_RISK_RATE_THRESHOLD turn on the call_rate
# signal: more than THRESHOLD calls by one agent inside WINDOW adds to
# that agent's risk. Both or neither, nia-gateway refuses to start with
# one of the two. Deliberately unset here for the same reason the three
# risk thresholds are: the right numbers depend on what an agent's
# normal traffic actually looks like, and a guessed threshold either
# never fires or fires on everything, feeding a total that can kill an
# agent outright.
#
# NIA_RISK_DATABASE_URL, same postgres and database as the others
# above, a different table (risk_state, see
# internal/monitoring/postgres_risk_store.go). Only matters if the risk
# thresholds above are also set and this compose file is ever scaled to
# more than one nia-gateway replica: without it, each replica keeps its
# own private running risk total per agent, in memory, and an agent's
# real cumulative risk never adds up correctly across replicas, see
# docs/ARCHITECTURE.md's "Distributed state" section. Verified this
# pass against two real nia-gateway processes and a real Postgres, not
# against this exact compose stack scaled up, that specific combination
# is still open, same caveat NIA_CREDENTIALS_DATABASE_URL's own comment
# above already states for its own compose-vs-bare-processes gap.
services:
  nia-api:
    build:
      context: ..
      dockerfile: deployments/Dockerfile.api
    ports:
      - "8080:8080"
    environment:
      NIA_API_ADDR: ":8080"
      NIA_TESSERA_BASE_URL: "http://tessera:8080"
      NIA_TESSERA_JWT_SIGNING_KEY: "${NIA_TESSERA_JWT_SIGNING_KEY:?set this, see the comment at the top of this file}"
      NIA_AUDIT_DATABASE_URL: "postgres://nia:nia@postgres:5432/nia?sslmode=disable"
      NIA_CREDENTIALS_DATABASE_URL: "postgres://nia:nia@postgres:5432/nia?sslmode=disable"
      NIA_OPERATOR_TOKENS_PATH: "/etc/nia/operator-tokens.json"
      NIA_OPENFGA_API_URL: "http://openfga:8080"
      NIA_OPENFGA_STORE_ID: "${TESSERA_OPENFGA_STORE_ID:?create a store against openfga first and set this, see the comment at the top of this file}"
      NIA_REGISTRY_DATABASE_URL: "postgres://nia:nia@postgres:5432/nia?sslmode=disable"
      NIA_POLICY_LOCK_DATABASE_URL: "postgres://nia:nia@postgres:5432/nia?sslmode=disable"
      NIA_INCIDENT_DATABASE_URL: "postgres://nia:nia@postgres:5432/nia?sslmode=disable"
    volumes:
      - ./operator-tokens.json:/etc/nia/operator-tokens.json:ro
    depends_on:
      tessera:
        condition: service_healthy
      postgres:
        condition: service_healthy
      openfga:
        condition: service_started

  nia-gateway:
    build:
      context: ..
      dockerfile: deployments/Dockerfile.gateway
    ports:
      - "8081:8081"
    environment:
      NIA_GATEWAY_ADDR: ":8081"
      NIA_TESSERA_BASE_URL: "http://tessera:8080"
      NIA_TESSERA_JWT_SIGNING_KEY: "${NIA_TESSERA_JWT_SIGNING_KEY:?set this, see the comment at the top of this file}"
      NIA_AUDIT_DATABASE_URL: "postgres://nia:nia@postgres:5432/nia?sslmode=disable"
      NIA_CREDENTIALS_DATABASE_URL: "postgres://nia:nia@postgres:5432/nia?sslmode=disable"
      NIA_TOOLS_API_URL: "http://nia-api:8080"
      NIA_OPERATOR_TOKENS_PATH: "/etc/nia/operator-tokens.json"
      NIA_OPENFGA_API_URL: "http://openfga:8080"
      NIA_OPENFGA_STORE_ID: "${TESSERA_OPENFGA_STORE_ID:?create a store against openfga first and set this, see the comment at the top of this file}"
      NIA_REGISTRY_DATABASE_URL: "postgres://nia:nia@postgres:5432/nia?sslmode=disable"
      NIA_POLICY_LOCK_DATABASE_URL: "postgres://nia:nia@postgres:5432/nia?sslmode=disable"
      NIA_INCIDENT_DATABASE_URL: "postgres://nia:nia@postgres:5432/nia?sslmode=disable"
    volumes:
      - ./operator-tokens.json:/etc/nia/operator-tokens.json:ro
    depends_on:
      tessera:
        condition: service_healthy
      postgres:
        condition: service_healthy
      openfga:
        condition: service_started
      nia-api:
        condition: service_started

  tessera:
    build:
      context: ../../tessera
    ports:
      - "8090:8080"
    environment:
      TESSERA_JWT_SIGNING_KEY: "${NIA_TESSERA_JWT_SIGNING_KEY:?set this, see the comment at the top of this file}"
      OPENFGA_API_URL: "http://openfga:8080"
      OPENFGA_STORE_ID: "${TESSERA_OPENFGA_STORE_ID:?create a store against openfga first and set this, see the comment at the top of this file}"
    depends_on:
      - openfga

  openfga:
    image: openfga/openfga:latest
    command: run
    ports:
      - "8082:8080"   # HTTP
      - "8083:8081"   # gRPC
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: nia
      POSTGRES_PASSWORD: nia
      POSTGRES_DB: nia
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nia -d nia"]
      interval: 5s
      timeout: 3s
      retries: 5
    volumes:
      - nia-postgres:/var/lib/postgresql/data

volumes:
  nia-postgres:
